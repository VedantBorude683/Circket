events {}
http {
  upstream gateway_up { server gateway:4000; }
  upstream realtime_up { server realtime:4003; }
  server {
    listen 80;
    location /api/ { proxy_pass http://gateway_up; }
    location /socket.io/ { proxy_pass http://realtime_up; proxy_http_version 1.1; }
    location / { proxy_pass http://web:80; }
  }
}
