<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>VoiceScore</title>
  </head>
  <body>
    <main>
      <h1>VoiceScore</h1>
      <p>M3 live scoring demo</p>
      <label>Match ID <input id="match" value="demo" /></label>
      <button id="four">Score four</button>
      <button id="undo">Undo last</button>
      <button id="voice">Speak</button>
      <pre id="status">Ready</pre>
    </main>
    <script>
      const status = document.getElementById("status");
      const command = (value) =>
        fetch(
          `/api/matches/${document.getElementById("match").value}/commands`,
          {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify(value)
          }
        )
          .then(async (response) => {
            status.textContent = await response.text();
          })
          .catch((error) => {
            status.textContent = error.message;
          });
      document.getElementById("four").onclick = () =>
        command({
          clientEventId: crypto.randomUUID(),
          epoch: 0,
          source: "button",
          command: { kind: "record_ball", ball: { runsOffBat: 4 } }
        });
      document.getElementById("undo").onclick = () =>
        command({
          clientEventId: crypto.randomUUID(),
          epoch: 0,
          source: "button",
          command: { kind: "undo_last" }
        });
      document.getElementById("voice").onclick = () => {
        const Recognition =
          window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!Recognition) {
          status.textContent = "Speech input is unavailable; use buttons.";
          return;
        }
        const recognition = new Recognition();
        recognition.lang = "en-IN";
        recognition.onresult = (event) => {
          const transcript = event.results[0][0].transcript;
          status.textContent = `Heard: ${transcript}`;
          fetch("/parse", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ transcript, context: {} })
          }).then(async (response) => {
            status.textContent = await response.text();
          });
        };
        recognition.start();
      };
    </script>
  </body>
</html>
